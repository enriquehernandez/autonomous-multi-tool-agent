[project]
name = "autonomous-multi-tool-agent"
version = "0.1.0"
description = "Agente autónomo con LangGraph, Tool Calling y capacidades multimodales."
readme = "README.md"
authors = [
    { name = "Enrique Hernández", email = "ehl.net@gmail.com" }
]
requires-python = ">=3.11,<3.13"

dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "langchain",
    "langgraph",
    "langchain-openai",
    "langchain-google-genai",
    "langchain-groq",
    "httpx",
    "python-dotenv",
    "pydantic-settings",
    "pytest",
    "python-multipart",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]