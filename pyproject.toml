[project]
name = "autonomous-multi-tool-agent"
version = "0.1.0"
description = "Agente autónomo con LangGraph, Tool Calling y capacidades multimodales."
readme = "README.md"
authors = [
    { name = "Enrique Hernández", email = "ehl.net@gmail.com" }
]
requires-python = ">=3.11,<3.13"

dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "langchain",
    "langgraph",
    "langchain-openai",
    "langchain-google-genai",
    "langchain-groq",
    "httpx",
    "python-dotenv",
    "pydantic-settings",
    "pytest",
    "python-multipart",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "pytest-cov>=7.1.0",
    "tomlscript>=0.2.1",
]

[tool.pytest.ini_options]
addopts = "--cov=app --cov-report=term-missing --cov-report=html"

[tool.tomlscript]
# Levantar el servidor en el puerto 8001
dev = "uv run uvicorn app.main:app --reload --port 8001"

# Correr todos los tests con cobertura
test = "uv run pytest tests/ --cov=app --cov-report=term-missing"

# Correr solo un test específico (por ejemplo, el de la API)
test-api = "uv run pytest tests/test_api.py -v"

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:"
]