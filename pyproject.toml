[project]
name = "autonomous-multi-tool-agent"
version = "0.1.0"
description = "Agente autónomo con LangGraph, Tool Calling y capacidades multimodales."
authors = [{ name = "Enrique Hernández", email = "enrique.hernandez@basedos.cl" }]
requires-python = ">=3.11,<3.13"

dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "langchain",
    "langgraph",                 # El framework de agentes top
    "langchain-openai",
    "langchain-anthropic",
    "langchain-google-genai",
    "langchain-groq",
    "httpx",                     # Para consumir APIs REST en las tools
    "python-dotenv",
    "pydantic-settings",
    "pytest"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]